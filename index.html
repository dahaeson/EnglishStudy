<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Study</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- XLSX 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<div class="container">

    <!-- =========================
            HEADER
    ========================== -->

    <header class="header">

        <h1>📗 English Study</h1>

        <p>영어 문장 암기</p>

    </header>

    <!-- =========================
            DATE
    ========================== -->

    <section class="date-box">

        <label>📅 날짜</label>

        <input
            type="date"
            id="studyDate">

    </section>

    <!-- =========================
            INPUT
    ========================== -->

    <section class="input-card">

        <h2>영어 문장</h2>

        <textarea
            id="englishInput"
            placeholder="예) I have to study."></textarea>

        <h2>한국어 뜻</h2>

        <textarea
            id="koreanInput"
            placeholder="예) 나는 공부해야 한다."></textarea>

        <button
            id="addSentenceBtn">

            ➕ 문장 추가

        </button>

    </section>

    <!-- =========================
            XLSX
    ========================== -->

    <section class="upload-card">

        <h2>📂 Excel 업로드</h2>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx">

    </section>

    <!-- =========================
            VOICE
    ========================== -->

    <section class="voice-card">

        <h2>🎙 영어 음성</h2>

        <select id="voiceSelect">

            <option value="usFemale">

                🇺🇸 미국 여자

            </option>

            <option value="ukFemale">

                🇬🇧 영국 여자

            </option>

        </select>

    </section>

    <!-- =========================
            STUDY CARD
    ========================== -->

    <section class="study-card">

        <div
            id="englishSentence"
            class="english">

            Hello.

        </div>

        <div
            id="koreanSentence"
            class="korean">

            안녕하세요.

        </div>

    </section>
