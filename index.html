<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 문장 암기</title>
    <!-- style.css 파일이 같은 폴더에 있는지 확인하세요. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 헤더 영역 -->
        <div class="header">
            <h1>영어 문장 암기</h1>
            <p>문장 · 뜻 · 영어 음성</p>
        </div>

        <!-- 🔥 메인 암기 카드 (참고 이미지 디자인) -->
        <div id="flashcard" class="flashcard">
            <div id="sentence" class="sentence">문장이 없습니다.</div>
            <div id="meaning" class="meaning"></div>

            <div class="btn-group">
                <button type="button" class="btn btn-audio" id="speakBtn">🔊 듣기</button>
                <button type="button" class="btn btn-primary" id="nextBtn">다음 문장 ➡️</button>
                <button type="button" class="btn btn-random" id="randomBtn">🎲 랜덤 문장</button>
            </div>
        </div>

        <!-- 입력 섹션 (여기는 기존 스타일 유지 or 추가) -->
        <div class="input-section">
            <h2>✏️ 문장 추가</h2>
            <input type="text" id="newenglish" placeholder="영어 문장을 입력하세요">
            <input type="text" id="newKorean" placeholder="한글 뜻을 입력하세요">
            <button type="button" class="btn btn-primary" id="addBtn">문장 저장</button>
        </div>

        <!-- CSV 업로드 섹션 -->
        <div class="csv-section">
            <h2>📂 CSV 업로드</h2>
            <p>형식 : 영어,뜻</p>
            <input type="file" id="csvFile" accept=".csv">
            <button type="button" class="btn btn-secondary" id="importBtn">업로드</button>
        </div>

        <!-- 저장된 문장 목록 섹션 -->
        <div class="list-section">
            <div class="list-header">
                <h2>📖 저장된 문장 목록</h2>
                <button type="button" class="btn btn-danger" id="deleteAllBtn">전체 삭제</button>
            </div>
            <!-- 🔥 JS가 여기에 리스트 아이템을 넣습니다 -->
            <div id="sentenceList" class="sentence-list-container"></div>
        </div>
    </div>

    <!-- 스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
