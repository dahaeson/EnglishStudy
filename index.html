<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 문장 암기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <h1>영어 문장 암기</h1>
            <p>문장 · 뜻 · 영어 음성</p>
        </div>

        <!-- 메인 암기 카드 -->
        <div class="card-section">
            <div id="sentence" class="sentence-box">문장이 없습니다.</div>
            <div id="meaning" class="meaning-box"></div>

            <div class="btn-group">
                <button type="button" onclick="speakSentence()">🔊 음성 듣기</button>
                <button type="button" onclick="nextSentence()">다음 문장 ➡️</button>
                <button type="button" onclick="randomSentence()">🎲 랜덤 문장</button>
            </div>
        </div>

        <!-- 문장 추가 영역 -->
        <div class="input-section">
            <h2>✏️ 문장 추가</h2>
            <input type="text" id="newenglish" placeholder="영어 문장을 입력하세요">
            <input type="text" id="newKorean" placeholder="한글 뜻을 입력하세요">
            <!-- type="button" 추가하여 새로고침 방지 -->
            <button type="button" onclick="addSentence()">문장 저장</button>
        </div>

        <!-- CSV 업로드 영역 -->
        <div class="csv-section">
            <h2>📂 CSV 업로드</h2>
            <p>형식 : 영어,뜻</p>
            <input type="file" id="csvFile" accept=".csv">
            <button type="button" onclick="importCSV()">업로드</button>
        </div>

        <!-- 저장된 문장 목록 -->
        <div class="list-section">
            <div class="list-header">
                <h2>📖 저장된 문장 목록</h2>
                <button type="button" class="delete-all-btn" onclick="deleteAllSentences()">전체 삭제</button>
            </div>
            <div id="sentenceList"></div>
        </div>
    </div>

    <!-- 스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
