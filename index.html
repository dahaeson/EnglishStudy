<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>영어 문장 암기</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="header">
        <h1>영어 문장 암기</h1>
        <p>문장 · 뜻 · 영어 음성</p>
    </div>

    <!-- 학습 카드 -->
    <div class="card">

        <div id="sentence" class="sentence"></div>

        <div id="meaning" class="meaning"></div>

        <div class="button-group">

            <button onclick="speakSentence()">
                🔊 듣기
            </button>

            <button onclick="nextSentence()">
                다음 문장
            </button>

            <button onclick="randomSentence()">
                랜덤
            </button>

        </div>

    </div>

    <!-- 문장 추가 -->
    <div class="card">

        <h2>✏️ 문장 추가</h2>

        <input
            type="text"
            id="newJapanese"
            placeholder="영어 문장">

        <input
            type="text"
            id="newKorean"
            placeholder="한국어 뜻">

        <button onclick="addSentence()">
            문장 저장
        </button>

    </div>

    <!-- CSV 업로드 -->
    <div class="card">

        <h2>📂 CSV 업로드</h2>

        <p class="guide">
            형식 : 영어,뜻
        </p>

        <input
            type="file"
            id="csvFile"
            accept=".csv">

        <button onclick="importCSV()">
            CSV 가져오기
        </button>

    </div>

    <!-- 저장 목록 -->
    <div class="card">

        <div class="list-header">

            <h2>📖 저장된 문장</h2>

            <button
                class="danger"
                onclick="deleteAllSentences()">

                전체 삭제

            </button>

        </div>

        <div id="sentenceList"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
